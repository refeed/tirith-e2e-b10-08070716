name: policy
on: pull_request
permissions: { contents: read, pull-requests: write, checks: write }
env:
  SG_API_TOKEN: ${{ secrets.SG_API_TOKEN }}
  SG_ORG: ${{ vars.SG_ORG }}
  SG_API_URL: https://testapi.qa.stackguardian.io/api/v1
  SG_DASH: https://dash.qa.stackguardian.io

jobs:
  # Case 1: the ordinary plan run. Source uploaded by default, plan masked client-side,
  # infracost generated, checkov + the approval policy evaluated, sticky comment written.
  plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: tirith
        uses: StackGuardian/tirith-iac-governance-action@feat/tirith-policy-check
        with:
          sg-api-url: ${{ env.SG_API_URL }}
          sg-dashboard-url: ${{ env.SG_DASH }}
          workflow-id: e2e-notion-plan
          comment-tag: plan
      - if: always()
        run: echo "PLAN verdict=${{ steps.tirith.outputs.verdict }} url=${{ steps.tirith.outputs.wfrun-url }}"

  # Case 2: a state document. This is what the removal of policyInputKind changes -- routing is
  # now purely "no plan.json, so tfstate.json goes to the json provider".
  state:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: tirith
        uses: StackGuardian/tirith-iac-governance-action@feat/tirith-policy-check
        with:
          sg-api-url: ${{ env.SG_API_URL }}
          sg-dashboard-url: ${{ env.SG_DASH }}
          input-kind: terraform_state
          state-path: state.json
          source-dir: ""
          workflow-id: e2e-notion-state
          comment-tag: state
      - if: always()
        run: echo "STATE verdict=${{ steps.tirith.outputs.verdict }} url=${{ steps.tirith.outputs.wfrun-url }}"

  # Case 3: the two-phase pipeline. Same workflow-id as the plan job, so the workflow already
  # exists with whatever the first phase stored -- the exact shape that made a stored input kind
  # feed a state document to the terraform_plan provider.
  two-phase:
    needs: plan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: tirith
        uses: StackGuardian/tirith-iac-governance-action@feat/tirith-policy-check
        with:
          sg-api-url: ${{ env.SG_API_URL }}
          sg-dashboard-url: ${{ env.SG_DASH }}
          input-kind: terraform_state
          state-path: state.json
          source-dir: ""
          workflow-id: e2e-notion-plan
          comment-tag: two-phase
      - if: always()
        run: echo "TWOPHASE verdict=${{ steps.tirith.outputs.verdict }} url=${{ steps.tirith.outputs.wfrun-url }}"

  # Case 4: no credentials at all -- policies come from the repository, nothing leaves the runner.
  local:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: tirith
        uses: StackGuardian/tirith-iac-governance-action@feat/tirith-policy-check
        env:
          SG_API_TOKEN: ""
          SG_ORG: ""
        with:
          comment-tag: local
      - if: always()
        run: echo "LOCAL verdict=${{ steps.tirith.outputs.verdict }} mode=${{ steps.tirith.outputs.mode }}"
