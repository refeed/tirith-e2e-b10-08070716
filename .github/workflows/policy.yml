name: policy
on: pull_request
permissions: { contents: read, pull-requests: write, checks: write }
env:
  SG_API_TOKEN: ${{ secrets.SG_API_TOKEN }}
  SG_ORG: ${{ vars.SG_ORG }}
jobs:
  tirith:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: tirith
        uses: StackGuardian/tirith-iac-governance-action@feat/tirith-policy-check
        with:
          sg-api-url: https://testapi.qa.stackguardian.io/api/v1
          sg-dashboard-url: https://dash.qa.stackguardian.io
          fail-on-error: "true"
      - if: always()
        run: echo "verdict=${{ steps.tirith.outputs.verdict }} url=${{ steps.tirith.outputs.wfrun-url }}"
